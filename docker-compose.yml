version: '3.8'

services:
  # Servicio Frontend RAG HR
  rag-hr-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-hr-frontend
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - LOG_LEVEL=INFO
      - DEBUG_MODE=False
      - USE_MOCK_DATA=True
    volumes:
      # En desarrollo, mapear el código fuente para hot reload
      - .:/app
      - streamlit_cache:/home/streamlit/.streamlit/cache
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    labels:
      - "com.example.description=RAG HR Frontend"
      - "com.example.version=1.0.0"

volumes:
  streamlit_cache:

networks:
  rag-network:
    driver: bridge

# Para ejecutar:
# docker-compose up                 # Ejecutar en primer plano
# docker-compose up -d              # Ejecutar en background
# docker-compose down               # Detener y remover
# docker-compose logs -f            # Ver logs
# docker-compose ps                 # Ver estado
